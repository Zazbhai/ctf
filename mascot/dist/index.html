<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>Mascot — animated assistant</title>
    <link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <div class="wrap">
  <div class="eyebrow">Animated assistant · sprite states</div>

  <div class="stage" id="stage">
    <div class="glow"></div>
    <div class="rig" id="rig">
      <img class="sprite m-idle" id="sprite" alt="Assistant character">
    </div>
  </div>

  <div class="bubble"><span id="line"></span><span class="caret"></span></div>

  <div class="controls" id="controls"></div>
  <button class="run" id="run">Play a match</button>

  <p class="hint">Move the cursor — he follows it</p>
</div>
    <script  src="./script.js"></script>

  </body>
  
</html>
